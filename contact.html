<style>
  /* ===== TechAid Brand Styling ===== */
  :root {
    --tac-primary: #0A3D62;      /* Deep professional blue */
    --tac-accent: #3C6382;       /* Soft tech blue */
    --tac-light: #f5f7fa;        /* Clean background */
    --tac-text: #2c3e50;         /* Dark slate */
    --tac-border: #dfe6e9;       /* Light grey */
  }

  body {
    font-family: 'Inter', 'Segoe UI', sans-serif;
    background: var(--tac-light);
    color: var(--tac-text);
    margin: 0;
    padding: 0;
  }

  .tac-container {
    max-width: 700px;
    margin: 40px auto;
    background: #fff;
    padding: 40px;
    border-radius: 12px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.06);
  }

  h2 {
    color: var(--tac-primary);
    margin-bottom: 10px;
    font-size: 28px;
    font-weight: 600;
  }

  p {
    margin-bottom: 25px;
    line-height: 1.6;
  }

  label {
    display: block;
    margin-bottom: 6px;
    font-weight: 600;
    color: var(--tac-primary);
  }

  input, textarea {
    width: 100%;
    padding: 14px;
    margin-bottom: 20px;
    border: 1px solid var(--tac-border);
    border-radius: 8px;
    font-size: 15px;
    transition: 0.2s;
  }

  input:focus, textarea:focus {
    border-color: var(--tac-accent);
    outline: none;
    box-shadow: 0 0 0 3px rgba(60, 99, 130, 0.15);
  }

  textarea {
    min-height: 140px;
    resize: vertical;
  }

  button {
    background: var(--tac-primary);
    color: #fff;
    padding: 14px 22px;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
    transition: 0.2s;
    width: 100%;
    font-weight: 600;
  }

  button:hover {
    background: var(--tac-accent);
  }

  /* Anti-bot honeypot */
  .honeypot {
    display: none;
  }
</style>

<div class="tac-container">
  <h2>Book a Meeting (Google Meet)</h2>
  <p>Please provide two optional meeting times. We will confirm the one that best fits our schedule and send a Google Meet link from <strong>techaidconsultants@gmail.com</strong>.</p>

  <form action="https://formspree.io/f/mrpbayqo" method="POST">

    <label for="name">Full Name</label>
    <input type="text" id="name" name="name" required>

    <label for="role">Role / Position</label>
    <input type="text" id="role" name="role" placeholder="e.g., Director, Project Manager" required>

    <label for="email">Email</label>
    <input type="email" id="email" name="email" required>

    <label for="phone">Phone (optional)</label>
    <input type="text" id="phone" name="phone">

    <label for="slot1">Preferred Meeting Slot #1</label>
    <input type="datetime-local" id="slot1" name="slot1" required>

    <label for="slot2">Preferred Meeting Slot #2</label>
    <input type="datetime-local" id="slot2" name="slot2">

    <label for="message">Message / Project Details</label>
    <textarea id="message" name="message" required></textarea>

    <!-- Anti‑bot honeypot -->
    <div class="honeypot">
      <label>Leave this field empty</label>
      <input type="text" name="_gotcha">
    </div>

    <button type="submit">Request Meeting</button>
  </form>

  <p style="margin-top:20px; font-size:14px; color:var(--tac-accent);">
    Once reviewed, we will confirm the meeting and send a Google Meet link to your email.
  </p>
</div>
